<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dots and Boxes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔲</text></svg>">
<style>
:root{--bg:#f6f4ef;--fg:#222;--mut:#777;--dot:#333;--edge:#d8d4ca;--p1:#2f6fed;--p2:#e8742c}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#eee;--mut:#999;--dot:#ddd;--edge:#3a3a3d;--p1:#6a9bff;--p2:#ff9a58}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
h1{font-size:1.4rem;margin:8px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;margin:8px 0}
.pill{padding:6px 14px;border-radius:999px;border:2px solid transparent;font-weight:600}
.pill.on{border-color:currentColor}
#s1{color:var(--p1)}#s2{color:var(--p2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--edge);margin-right:6px}
.dot.on{background:#3cb371}
button,input{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--edge);background:transparent;color:var(--fg)}
button{cursor:pointer}button:disabled{opacity:.4;cursor:default}
input{width:7em;text-transform:uppercase;text-align:center;letter-spacing:.15em}
svg{width:min(92vw,440px);height:auto;touch-action:manipulation}
.hit{stroke:transparent;stroke-width:26;cursor:pointer}
.line{stroke:var(--edge);stroke-width:5;stroke-linecap:round}
.hit:hover+.line{stroke:var(--mut)}
.drawn{stroke-width:7}
#msg{min-height:1.5em;color:var(--mut);margin:6px 0;text-align:center}
.code{font-family:ui-monospace,monospace;font-size:1.3rem;letter-spacing:.2em;font-weight:700}
.hide{display:none}
</style></head><body>
<h1>Squared</h1>
<div id="lobby" class="hide">
 <div class="row"><button id="create">Start game</button></div>
 <div class="row">Add a code here<input id="code" maxlength="4" placeholder="ABCD" autocapitalize="characters"><button id="join">Join</button></div>
</div>
<div id="game" class="hide">
 <div class="row">Room <span class="code" id="rc"></span><button id="copy">Copy link</button></div>
 <div class="row"><span class="pill" id="s1"></span><span class="pill" id="s2"></span></div>
 <svg id="b" viewBox="0 0 300 300"></svg>
</div>
<div id="msg"></div>
<div class="row hide" id="ctl"><button id="again" disabled>Rematch</button><button id="leave">Leave</button></div>
<script>
const N=4,S=60,M=30,NS="http://www.w3.org/2000/svg",$=i=>document.getElementById(i);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let token=store.get("dab-token");
if(!token){const a=new Uint8Array(16);crypto.getRandomValues(a);token=[...a].map(x=>x.toString(16).padStart(2,"0")).join("");store.set("dab-token",token)}
let room=null,es=null,g=null,busy=false;
const col=p=>`var(--p${p+1})`,say=t=>$("msg").textContent=t;
function show(w){$("lobby").classList.toggle("hide",w!=="lobby");$("game").classList.toggle("hide",w!=="game");$("ctl").classList.toggle("hide",w!=="game");
 if(w==="lobby")say("Time to send somebody to school")}
//  if(w==="lobby")say("Create a game, then send your friend the link or room code.")}
async function post(path,body){
 const r=await fetch("/api/"+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,...body})});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"request failed");return j}
function svgEl(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e}

async function create(){try{const{code}=await post("create",{});enter(code)}catch(e){say("Couldn't create game: "+e.message)}}
async function joinCode(c){c=c.trim().toUpperCase();if(c.length!==4)return;enter(c)}
async function enter(c){
 try{await post("join",{code:c})}catch(e){store.set("dab-room");history.replaceState(null,"","#");show("lobby");say(e.message==="no such room"?"No game with that code.":e.message);return}
 room=c;store.set("dab-room",c);history.replaceState(null,"","#"+c);$("rc").textContent=c;show("game");
 es&&es.close();es=new EventSource(`/api/events?code=${c}&token=${token}`);
 es.onmessage=m=>{const d=JSON.parse(m.data);if(g&&d.mv<g.mv&&d.round===g.round)return;g=d;draw()};
 es.onerror=()=>{say("Reconnecting…")};
}
function leave(){es&&es.close();es=null;g=null;room=null;store.set("dab-room");history.replaceState(null,"","#");show("lobby")}

function draw(){
 const svg=$("b");svg.innerHTML="";
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const o=g.own[r+","+c];
  svg.appendChild(svgEl("rect",{x:M+c*S+4,y:M+r*S+4,width:S-8,height:S-8,rx:8,fill:o==null?"transparent":col(o)}));
  if(o!=null){const t=svgEl("text",{x:M+c*S+S/2,y:M+r*S+S/2+7,"text-anchor":"middle","font-size":22,"font-weight":700,fill:"#fff"});t.textContent=o+1;svg.appendChild(t)}}
 const my=g.you===g.turn&&!g.over&&g.joined[1];
 const list=[];for(let r=0;r<=N;r++)for(let c=0;c<N;c++)list.push(["h",r,c]);
 for(let r=0;r<N;r++)for(let c=0;c<=N;c++)list.push(["v",r,c]);
 for(const[t,r,c]of list){
  const x1=M+c*S,y1=M+r*S,x2=t==="h"?x1+S:x1,y2=t==="h"?y1:y1+S,k=t+r+","+c,o=g.e[k];
  const gr=svgEl("g",{});svg.appendChild(gr);
  if(o==null&&my){const h=svgEl("line",{x1,y1,x2,y2,class:"hit"});h.onclick=()=>move(k);gr.appendChild(h)}
  const l=svgEl("line",{x1,y1,x2,y2,class:"line"+(o!=null?" drawn":"")});if(o!=null)l.style.stroke=col(o);gr.appendChild(l)}
 for(let r=0;r<=N;r++)for(let c=0;c<=N;c++)svg.appendChild(svgEl("circle",{cx:M+c*S,cy:M+r*S,r:6,fill:"var(--dot)"}));
 const tag=i=>`<span class="dot${g.online[i]?" on":""}"></span>Player ${i+1}${g.you===i?" (you)":""}: ${g.sc[i]}`;
 $("s1").innerHTML=tag(0);$("s2").innerHTML=tag(1);
 $("s1").classList.toggle("on",!g.over&&g.turn===0);$("s2").classList.toggle("on",!g.over&&g.turn===1);
 $("again").disabled=!g.over||g.you<0;
 if(!g.joined[1])say(g.you===0?"Waiting for your opponent — share the link or code "+room+".":"Joining…");
 else if(g.over){const[a,b]=g.sc;say(a===b?"It's a draw!":g.you<0?`Player ${a>b?1:2} wins!`:(a>b?0:1)===g.you?"You win! 🎉":"You lost — rematch?")}
 else if(g.you<0)say(`Spectating — Player ${g.turn+1} to move.`);
 else say(my?"Your move":"Waiting for the other player…");
}
async function move(k){
 if(busy)return;busy=true;
 try{await post("move",{code:room,edge:k})}catch(e){say(e.message)}busy=false}
$("create").onclick=create;$("join").onclick=()=>joinCode($("code").value);
$("code").onkeydown=e=>{if(e.key==="Enter")joinCode($("code").value)};
$("again").onclick=()=>post("rematch",{code:room}).catch(e=>say(e.message));
$("leave").onclick=leave;
$("copy").onclick=async()=>{const u=location.origin+"/#"+room;try{await navigator.clipboard.writeText(u);$("copy").textContent="Copied!"}catch(e){$("copy").textContent=u}
 setTimeout(()=>$("copy").textContent="Copy link",1500)};
const h=(location.hash||"").replace("#","").toUpperCase()||store.get("dab-room");
h&&h.length===4?enter(h):show("lobby");
</script></body></html>
